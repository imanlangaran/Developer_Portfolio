
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Iman Langaran Portfolio</title>
    <meta name="description" content="The page you're looking for could not be found. Return to Iman Langaran's portfolio homepage.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://imanlangaran.github.io/Developer_Portfolio/">
    
    <title>Redirecting ...</title>

    <script>
      const path = window.location.pathname;

      const repo = "/Developer_Portfolio";

      sessionStorage.redirect =
        path.replace(repo, "");

      window.location.replace(
        repo + "/"
      );
    </script>
  </head>
  <body></body>
</html>
